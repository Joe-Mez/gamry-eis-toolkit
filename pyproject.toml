[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gamry-eis-toolkit"
version = "1.0.0"
description = "Gamry DTA to Excel, equivalent circuit fitting and publication-quality Nyquist/Bode figures"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6", "pandas>=1.5",
                "openpyxl>=3.0", "pyyaml>=6.0", "python-docx>=0.8"]

[project.scripts]
run-eis = "eistool.cli:main"

[tool.setuptools]
packages = ["eistool"]

[tool.setuptools.package-data]
eistool = ["config_template.yaml"]
